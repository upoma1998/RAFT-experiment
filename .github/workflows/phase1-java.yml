name: Phase 1 - Java

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "runs per config"
        default: "10"
      configs:
        description: "comma-separated configs to run"
        default: "C,M,D,N"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        project:
          - activiti_activiti
          - alibaba.fastjson
          - apache_ambari
          - apache_commons-exec
          - apache_hbase
          - apache_httpcore
          - apache_incubator-dubbo
          - codingchili.excelastic
          - davidmoten.rxjava2-extras
          - elasticjob_elastic-job-lite
          - fluent.fluent-logger-java
          - hector-client_hector
          - javadelight.delight-nashorn-sandbox
          - jknack_handlebars.java
          - joel-costigliola_assertj-core
          - kagkarlsson.db-scheduler
          - kevinsawicki_http-request
          - ninjaframework_ninja
          - orbit_orbit
          - qos-ch_logback
          - spring-projects_spring-boot
          - square_okhttp
          - tootallnate.java-websocket
          - tootallnate_java-websocket
          - undertow-io_undertow
          - wildfly_wildfly
          - wro4j_wro4j
          - zxing_zxing
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase 1 sweep for ${{ matrix.project }}
        run: |
          python3 phase1_runner.py --only java --project "${{ matrix.project }}" \
            --runs "${{ github.event.inputs.runs || '10' }}" \
            --configs "${{ github.event.inputs.configs || 'C,M,D,N' }}" --max-minutes 340
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.project }}
          path: |
            phase1-results/java/results/${{ matrix.project }}.csv
            phase1-results/java/errors/${{ matrix.project }}.log
          if-no-files-found: warn
          retention-days: 14
