name: Phase 1 - Python

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "runs per config"
        default: "10"
      configs:
        description: "comma-separated configs to run"
        default: "C,M,D,N"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        project:
          - celery-celery
          - celery-kombu
          - conan-io-conan
          - delgan-loguru
          - encode-django-rest-framework
          - facebookresearch-hydra
          - flexget-flexget
          - fonttools-fonttools
          - graphql-python-graphene
          - ipython-ipython
          - mitmproxy-mitmproxy
          - mwaskom-seaborn
          - prefecthq-prefect
          - psf-requests
          - pygithub-pygithub
          - pylons-pyramid
          - pypa-setuptools
          - python-pillow-pillow
          - spesmilo-electrum
          - sunpy-sunpy
    steps:
      - uses: actions/checkout@v4
      - name: Run Phase 1 sweep for ${{ matrix.project }}
        run: |
          python3 phase1_runner.py --only python --project "${{ matrix.project }}" \
            --runs "${{ github.event.inputs.runs || '10' }}" \
            --configs "${{ github.event.inputs.configs || 'C,M,D,N' }}" --max-minutes 340
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.project }}
          path: |
            phase1-results/python/results/${{ matrix.project }}.csv
            phase1-results/python/errors/${{ matrix.project }}.log
          if-no-files-found: warn
          retention-days: 14
