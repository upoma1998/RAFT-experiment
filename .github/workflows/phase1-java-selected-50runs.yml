name: Phase 1 - Java Selected (websocket + logback, 50 runs)

on:
  workflow_dispatch:
    inputs:
      runs_per_chunk:
        description: "runs per chunk (5 chunks are run per job, so total runs = 5 x this)"
        default: "10"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        project:
          - tootallnate_java-websocket
          - qos-ch_logback
        config: [Baseline, C, M, D, N]
    steps:
      - uses: actions/checkout@v4

      - name: Chunk 1/5 (runs 1-10)
        run: |
          python3 phase1_runner.py --only java --project "${{ matrix.project }}" \
            --configs "${{ matrix.config }}" \
            --runs "${{ github.event.inputs.runs_per_chunk || '10' }}" \
            --run-offset 0

      - name: Chunk 2/5 (runs 11-20)
        if: always()
        run: |
          python3 phase1_runner.py --only java --project "${{ matrix.project }}" \
            --configs "${{ matrix.config }}" \
            --runs "${{ github.event.inputs.runs_per_chunk || '10' }}" \
            --run-offset 10

      - name: Chunk 3/5 (runs 21-30)
        if: always()
        run: |
          python3 phase1_runner.py --only java --project "${{ matrix.project }}" \
            --configs "${{ matrix.config }}" \
            --runs "${{ github.event.inputs.runs_per_chunk || '10' }}" \
            --run-offset 20

      - name: Chunk 4/5 (runs 31-40)
        if: always()
        run: |
          python3 phase1_runner.py --only java --project "${{ matrix.project }}" \
            --configs "${{ matrix.config }}" \
            --runs "${{ github.event.inputs.runs_per_chunk || '10' }}" \
            --run-offset 30

      - name: Chunk 5/5 (runs 41-50)
        if: always()
        run: |
          python3 phase1_runner.py --only java --project "${{ matrix.project }}" \
            --configs "${{ matrix.config }}" \
            --runs "${{ github.event.inputs.runs_per_chunk || '10' }}" \
            --run-offset 40

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.project }}-${{ matrix.config }}
          path: |
            phase1-results/java/results/${{ matrix.project }}.csv
            phase1-results/java/errors/${{ matrix.project }}.log
          if-no-files-found: warn
          retention-days: 14
